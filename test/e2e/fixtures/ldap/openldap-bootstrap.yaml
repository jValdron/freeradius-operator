apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-bootstrap
data:
  e2e.ldif: |
    dn: ou=users,dc=example,dc=org
    objectClass: organizationalUnit
    ou: users

    dn: uid=e2eldap,ou=users,dc=example,dc=org
    objectClass: inetOrgPerson
    objectClass: organizationalPerson
    objectClass: person
    uid: e2eldap
    cn: e2eldap
    sn: User
    userPassword: e2eldappass
