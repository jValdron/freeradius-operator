apiVersion: v1
kind: Service
metadata:
  name: openldap
spec:
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 389
      targetPort: ldap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
spec:
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: docker.io/bitnami/openldap:2.6.8
          ports:
            - name: ldap
              containerPort: 1389
          env:
            - name: LDAP_ADMIN_USERNAME
              value: admin
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap
                  key: adminpassword
            - name: LDAP_ROOT
              value: dc=example,dc=org
            - name: LDAP_USERS
              value: e2eldap
            - name: LDAP_PASSWORDS
              value: e2eldappass
