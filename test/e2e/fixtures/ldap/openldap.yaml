apiVersion: v1
kind: Service
metadata:
  name: openldap
spec:
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 389
      targetPort: ldap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
spec:
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          ports:
            - name: ldap
              containerPort: 389
          env:
            - name: LDAP_ORGANISATION
              value: Example
            - name: LDAP_DOMAIN
              value: example.org
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap
                  key: adminpassword
            - name: LDAP_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap
                  key: adminpassword
            - name: LDAP_TLS
              value: "false"
            - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
              value: "true"
          readinessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openldap-seed
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-ldap
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z openldap 389; do
                echo "waiting for openldap:389"
                sleep 2
              done
      containers:
        - name: seed
          image: osixia/openldap:1.5.0
          env:
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap
                  key: adminpassword
          command:
            - bash
            - -ec
            - |
              set -o pipefail
              if ldapwhoami -x -H ldap://openldap:389 \
                -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD" >/dev/null; then
                echo "admin bind OK"
              fi
              ldapadd -x -c -H ldap://openldap:389 \
                -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD" \
                -f /seed/e2e.ldif
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed
          configMap:
            name: openldap-bootstrap
