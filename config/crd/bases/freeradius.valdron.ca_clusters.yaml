---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clusters.freeradius.valdron.ca
spec:
  group: freeradius.valdron.ca
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: Cluster is the Schema for the clusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec defines the desired state of Cluster.
            properties:
              certificate:
                description: CertificateSpec configures server TLS for EAP.
                properties:
                  certificates:
                    description: InlineCertificates holds PEM material for legacy
                      / bootstrap setups.
                    properties:
                      ca:
                        minLength: 1
                        type: string
                      dh:
                        type: string
                      privateKey:
                        minLength: 1
                        type: string
                      publicKey:
                        minLength: 1
                        type: string
                    required:
                    - ca
                    - privateKey
                    - publicKey
                    type: object
                  dhSecretRef:
                    description: |-
                      Optional custom DH parameters (e.g. openssl dhparam). When omitted with
                      tlsSecretRef, FreeRADIUS/OpenSSL use default built-in DH parameters.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  fromSecretRef:
                    description: 'Legacy secret keys: ca, dh, privateKey, publicKey,
                      privateKeyPassword.'
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  privateKeyPassword:
                    type: string
                  tlsSecretRef:
                    description: cert-manager TLS secret (tls.crt, tls.key, optional
                      ca.crt).
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              debug:
                description: Run radiusd with -X (verbose logging).
                type: boolean
              defaultVlan:
                description: VLAN for authorize DEFAULT when set.
                format: int32
                type: integer
              eap:
                description: EAPSpec tunes generated mods-enabled/eap (secure defaults).
                properties:
                  cipherList:
                    default: DEFAULT
                    type: string
                  defaultEapType:
                    default: ttls
                    enum:
                    - ttls
                    - peap
                    - tls
                    type: string
                  innerVirtualServer:
                    default: inner-tunnel
                    type: string
                  tlsMaxVersion:
                    default: "1.3"
                    type: string
                  tlsMinVersion:
                    default: "1.2"
                    type: string
                type: object
              image:
                default: freeradius/freeradius-server:3.2.10-alpine
                description: FreeRADIUS container image.
                type: string
              isDefaultCluster:
                description: When true, unlabeled Client/User/Device resources are
                  assigned to this cluster.
                type: boolean
              ldap:
                description: LDAPSpec configures optional cluster-scoped LDAP for
                  inner-tunnel authentication.
                properties:
                  accessGroupDN:
                    description: When set, user filter is wrapped with (memberOf=<DN>).
                    type: string
                  authMode:
                    default: bindAsUser
                    description: LDAPAuthMode selects how FreeRADIUS uses LDAP during
                      inner-tunnel auth.
                    enum:
                    - bindAsUser
                    - mschap
                    type: string
                  baseDN:
                    minLength: 1
                    type: string
                  fromSecretRef:
                    description: SecretRef points at a Kubernetes Secret.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  identity:
                    description: Bind DN for LDAP searches (may also be supplied via
                      fromSecretRef key identity).
                    type: string
                  ntPasswordAttribute:
                    default: ntPassword
                    description: LDAP attribute mapped to NT-Password (mschap authMode
                      only).
                    type: string
                  port:
                    description: Port applies to plain-hostname entries only (not
                      ldap(s):// URIs).
                    format: int32
                    type: integer
                  servers:
                    description: Hostnames or ldap(s):// URIs. Rendered as FreeRADIUS
                      server = 'a b c'.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  startTLS:
                    type: boolean
                  tls:
                    description: LDAPTLSSpec configures TLS for LDAP connections.
                    properties:
                      caSecretRef:
                        description: PEM CA bundle for validating the LDAP server
                          certificate.
                        properties:
                          name:
                            minLength: 1
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  userBaseDN:
                    type: string
                  userFilter:
                    type: string
                required:
                - baseDN
                - fromSecretRef
                - servers
                type: object
              replicas:
                format: int32
                minimum: 0
                type: integer
              service:
                description: ServiceSpec configures the generated Service.
                properties:
                  loadBalancerIP:
                    type: string
                  type:
                    minLength: 1
                    type: string
                required:
                - type
                type: object
            required:
            - certificate
            - replicas
            - service
            type: object
          status:
            description: ClusterStatus defines the observed state of Cluster.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
