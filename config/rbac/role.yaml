---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - freeradius.valdron.ca
  resources:
  - clients
  - devices
  - users
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - freeradius.valdron.ca
  resources:
  - clusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - freeradius.valdron.ca
  resources:
  - clusters/finalizers
  verbs:
  - update
- apiGroups:
  - freeradius.valdron.ca
  resources:
  - clusters/status
  verbs:
  - get
  - patch
  - update
