apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: freeradius-primary-tls
spec:
  secretName: freeradius-primary-tls
  issuerRef:
    name: freeradius-selfsigned
    kind: Issuer
  dnsNames:
    - radius.example.com
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
