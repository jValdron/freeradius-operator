# Optional: only if you want custom DH parameters (openssl dhparam) instead of OpenSSL defaults.
#
#   openssl dhparam -out dh 2048
#   kubectl create secret generic freeradius-primary-dh --from-file=dh=dh
#
# Then set spec.certificate.dhSecretRef.name on the Cluster.
apiVersion: v1
kind: Secret
metadata:
  name: freeradius-primary-dh
type: Opaque
