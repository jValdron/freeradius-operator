apiVersion: freeradius.valdron.ca/v1
kind: Cluster
metadata:
  name: primary
spec:
  replicas: 1
  image: freeradius/freeradius-server:3.2.10-alpine
  service:
    type: ClusterIP
  certificate:
    tlsSecretRef:
      name: freeradius-primary-tls
  # Optional LDAP inner-tunnel auth (see README). Requires freeradius-ldap-bind Secret.
  # ldap:
  #   servers:
  #     - ldap.example.com
  #   baseDN: dc=example,dc=com
  #   fromSecretRef:
  #     name: freeradius-ldap-bind
