apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            - name: DRY_RUN
              value: "false"
            # Comma-separated list or leave empty to watch all namespaces.
            # Legacy single-namespace installs used NAMESPACE for the same purpose.
            - name: WATCH_NAMESPACE
              value: ""
